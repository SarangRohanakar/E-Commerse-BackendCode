services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: ecommerce-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ecommerce-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: your-upstash-kafka-url:9092   # Replace with Upstash URL

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce_db
