server:
  port: ${PORT:8080}

spring:
  application:
    name: ecommerce-monolith

  datasource:
    url: ${DATABASE_URL}                    # ← from Render env variable
    username: ${DATABASE_USERNAME}          # ← from Render env variable
    password: ${DATABASE_PASSWORD}          # ← from Render env variable
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info